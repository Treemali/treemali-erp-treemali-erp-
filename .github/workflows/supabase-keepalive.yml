name: Manter Supabase ativo

on:
  schedule:
    - cron: '0 11,23 * * *'   # 2x ao dia: 08:00 e 20:00 no horário de Brasília
  workflow_dispatch: {}        # permite rodar na mão pelo botão "Run workflow"

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultas leves no banco
        env:
          SUPABASE_URL: https://wvicjdhorighhcwkybfm.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          for tabela in clientes produtos configuracoes; do
            echo "Consultando $tabela..."
            curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 5 \
              -o /dev/null \
              "$SUPABASE_URL/rest/v1/$tabela?select=*&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          done
          echo "OK: banco consultado."
